<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archetypal Matrix — Alchemistery</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --void: #0a0a0c;
            --steel: #1a1b1e;
            --steel-light: #2a2b2e;
            --silver: #8a8b8e;
            --gold: #d4af37;
            --gold-dim: #b8992f;
            --white: #fafafa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--void);
            color: var(--white);
            overflow-x: hidden;
        }

        /* Header */
        header {
            padding: 5rem 2rem 4rem;
            text-align: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 5rem;
            font-weight: 300;
            letter-spacing: 0.08em;
            color: var(--gold);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--silver);
            font-weight: 400;
            letter-spacing: 0.25em;
            text-transform: uppercase;
        }

        /* Filters */
        .filters {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
        }

        .filter-btn {
            padding: 1.25rem 2.5rem;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--silver);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .filter-btn:hover {
            color: var(--gold);
        }

        .filter-btn.active {
            color: var(--gold);
            border-bottom-color: var(--gold);
        }

        /* Grid */
        .archetype-grid {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1px;
            background: rgba(212, 175, 55, 0.1);
        }

        /* Card */
        .archetype-card {
            background: var(--steel);
            padding: 3rem 2.5rem;
            cursor: pointer;
            position: relative;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .archetype-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 0;
            background: var(--gold);
            transition: height 0.4s ease;
        }

        .archetype-card:hover::before {
            height: 100%;
        }

        .archetype-card:hover {
            background: var(--steel-light);
            transform: translateX(10px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
        }

        .signs {
            font-size: 3rem;
            color: var(--gold);
            font-family: 'Cormorant Garamond', serif;
            letter-spacing: 0.5rem;
        }

        .element-badge {
            padding: 0.4rem 1rem;
            border: 1px solid var(--gold);
            background: transparent;
            font-size: 0.6rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--gold);
        }

        .archetype-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.75rem;
            font-weight: 400;
            margin-bottom: 1.25rem;
            color: var(--white);
            letter-spacing: 0.03em;
        }

        .archetype-desc {
            font-size: 0.9rem;
            color: var(--silver);
            line-height: 1.9;
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .keywords {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 2rem;
        }

        .keyword {
            padding: 0.4rem 0.9rem;
            background: transparent;
            border: 1px solid rgba(138, 139, 142, 0.3);
            font-size: 0.7rem;
            color: var(--silver);
            letter-spacing: 0.05em;
        }

        .famous {
            font-size: 0.75rem;
            color: var(--gold-dim);
            border-top: 1px solid rgba(212, 175, 55, 0.15);
            padding-top: 1.25rem;
            font-weight: 300;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 12, 0.97);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            backdrop-filter: blur(10px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--steel);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 5rem;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 2.5rem;
            right: 2.5rem;
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            width: 45px;
            height: 45px;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            font-weight: 200;
        }

        .close-btn:hover {
            background: var(--gold);
            color: var(--void);
        }

        .modal-header {
            text-align: center;
            margin-bottom: 4rem;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 3rem;
        }

        .modal-signs {
            font-size: 6rem;
            margin-bottom: 2rem;
            color: var(--gold);
            font-family: 'Cormorant Garamond', serif;
            letter-spacing: 1rem;
        }

        .modal-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            font-weight: 400;
            color: var(--white);
            margin-bottom: 1rem;
            letter-spacing: 0.03em;
        }

        .modal-subtitle {
            font-size: 0.85rem;
            color: var(--silver);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .modal-section {
            margin-bottom: 3rem;
        }

        .modal-section h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.75rem;
            font-weight: 400;
            color: var(--gold);
            margin-bottom: 1.5rem;
            letter-spacing: 0.05em;
        }

        .modal-section p {
            line-height: 2;
            color: var(--silver);
            font-weight: 300;
            font-size: 0.95rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1px;
            background: rgba(212, 175, 55, 0.1);
            margin-top: 3rem;
        }

        .stat {
            background: var(--steel-light);
            padding: 2.5rem;
            text-align: center;
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 1rem;
        }

        .stat-value {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.25rem;
            font-weight: 400;
            color: var(--white);
        }

        .loading {
            text-align: center;
            padding: 8rem 2rem;
            font-size: 0.85rem;
            color: var(--silver);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--void);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--gold-dim);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .archetype-grid {
                grid-template-columns: 1fr;
                gap: 1px;
            }

            .modal-content {
                padding: 2.5rem;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .filter-btn {
                padding: 1rem 1.5rem;
                font-size: 0.65rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Archetypal Matrix</h1>
        <p class="subtitle">144 Cosmic Signatures</p>
    </header>

    <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="fire">Fire</button>
        <button class="filter-btn" data-filter="earth">Earth</button>
        <button class="filter-btn" data-filter="air">Air</button>
        <button class="filter-btn" data-filter="water">Water</button>
    </div>

    <div class="archetype-grid" id="archetypeGrid">
        <div class="loading">Generating archetypal signatures...</div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">×</button>
            <div class="modal-header">
                <div class="modal-signs" id="modalSigns"></div>
                <h2 class="modal-title" id="modalTitle"></h2>
                <p class="modal-subtitle" id="modalSubtitle"></p>
            </div>
            <div class="modal-section">
                <h3>Essence</h3>
                <p id="modalDesc"></p>
            </div>
            <div class="modal-section">
                <h3>Characteristics</h3>
                <div id="modalKeywords"></div>
            </div>
            <div class="modal-section">
                <h3>Notable Bearers</h3>
                <p id="modalFamous"></p>
            </div>
            <div class="stats">
                <div class="stat">
                    <div class="stat-label">Element</div>
                    <div class="stat-value" id="modalElement"></div>
                </div>
                <div class="stat">
                    <div class="stat-label">Modality</div>
                    <div class="stat-value" id="modalModality"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="archetype-gallery.js"></script>
</body>

</html>
